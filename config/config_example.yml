# Optional. Copy to config/config.yml (git-ignored) to override the defaults.
# With no config.yml the pipeline uses ./data as the data root.
# Every path may be absolute, ~-prefixed, or relative to the repo root.

# Folder holding the Hugging Face dataset download (reglab/wisconsin-dairy-cafo).
# Populate it with `python download_data.py`. Env override: WI_CAFO_DATA_ROOT
data_root: data

# Optional: Wisconsin statewide parcels (WI SCO, V8.0.0) as a geofeather file.
# Only needed to draw parcel overlays on NAIP imagery figures, or to re-run
# clustering. Default: <data_root>/land_parcels/WI_parcels.feather
# parcels_path: /path/to/WI_parcels.feather

# Optional: GCP service-account key for NAIP imagery figures
# (skip with `generate_paper_results.py --skip-imagery`).
# See https://cloud.google.com/docs/authentication/provide-credentials-adc
# gcp_cred_path: /path/to/gcp-key.json
